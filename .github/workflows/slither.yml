name: Slither Analysis

on:
  workflow_call:

jobs:
  analyze:
    name: Slither static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          # Compile the Solidity entry point directly instead of using the
          # Hardhat adapter, which cannot parse this project's Hardhat 3 output.
          target: contracts/YieldVault.sol
          solc-version: 0.8.24
          slither-args: --solc-remaps '@openzeppelin/=node_modules/@openzeppelin/'
          fail-on: medium
          sarif: results.sarif
